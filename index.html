<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c2d"><link rel="manifest" href="manifest.webmanifest"><title>Minha Respiração • Ícaro</title><style>body{margin:0;background:#101c2d;color:#fff;font:18px system-ui;text-align:center}main{max-width:500px;margin:auto;padding:30px 20px}h1{font-size:27px}.circle{width:190px;height:190px;border-radius:50%;margin:32px auto;background:#4cb6c5;display:grid;place-items:center;color:#102031;font-size:45px;font-weight:700;transition:transform 1s ease}button{border:0;border-radius:14px;padding:16px 20px;margin:8px;background:#72d5cb;color:#102031;font-size:17px;font-weight:700}button:disabled{opacity:.35}#status{min-height:55px}small{color:#cbd5e1;display:block;line-height:1.5}input{width:70px;padding:8px;border-radius:8px;border:0}label{display:block;margin:12px}</style></head><body><main><h1>Minha Respiração • Ícaro</h1><p id="status">Pronto para começar</p><div class="circle" id="circle">50</div><p id="timer">00:00</p><div id="settings"><label>Segundos por respiração <input id="pace" type="number" min="2" max="8" step="0.5" value="3"></label><label><input id="sound" type="checkbox" checked> Sons de inspiração e expiração</label></div><button id="start">Começar</button><button id="next" disabled>Encerrar retenção</button><button id="stop">Parar</button><p id="cycle">Ciclo 0 de 3</p><small>Pratique sentado ou deitado, nunca na água, dirigindo ou em pé. Pare se sentir tontura, dor ou desconforto. Não force a retenção.</small></main><script>
let phase='idle',cycle=0,count=0,interval=null,startTime=0,ctx=null,wake=null;const $=id=>document.getElementById(id);function beep(freq=500,duration=.1){if(!$('sound').checked)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch(e){}}function clear(){if(interval)clearInterval(interval);interval=null}function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}async function keepAwake(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&phase!=='idle'&&phase!=='done')keepAwake()});function breathe(){phase='breathe';count=0;$('cycle').textContent=`Ciclo ${cycle} de 3`;$('next').disabled=true;$('start').disabled=true;const pace=Math.max(2,Math.min(8,Number($('pace').value)||3))*1000;let base=performance.now();function tick(){let elapsed=performance.now()-base;let step=Math.floor(elapsed/(pace/2));if(step>=100){clear();retention();return}let newCount=Math.floor(step/2)+1;count=newCount;let inhale=step%2===0;$('status').textContent=inhale?'Inspire profundamente':'Expire sem forçar';$('circle').textContent=count;$('circle').style.transform=inhale?'scale(1.13)':'scale(.88)';if(step!==tick.last){beep(inhale?660:390,.08);tick.last=step}}tick.last=-1;tick();interval=setInterval(tick,80)}function retention(){phase='retain';startTime=performance.now();$('status').textContent='Retenção livre — no seu tempo';$('circle').textContent='●';$('circle').style.transform='scale(1)';$('next').disabled=false;beep(850,.3);interval=setInterval(()=>$('timer').textContent=fmt((performance.now()-startTime)/1000),150)}function recovery(){clear();phase='recover';$('next').disabled=true;let start=performance.now();$('status').textContent='Inspire e segure confortavelmente por até 30 s';beep(800,.25);function tick(){let left=Math.max(0,30-(performance.now()-start)/1000);$('timer').textContent=fmt(Math.ceil(left));$('circle').textContent=Math.ceil(left);if(left<=0){clear();cycle++;if(cycle>3){phase='done';$('status').textContent='Sessão concluída';$('circle').textContent='✓';$('start').disabled=false;$('start').textContent='Recomeçar';if(wake)wake.release().catch(()=>{});}else{beep(950,.3);breathe()}}}tick();interval=setInterval(tick,100)}$('start').onclick=async()=>{clear();cycle=1;$('timer').textContent='00:00';$('settings').hidden=true;await keepAwake();breathe()};$('next').onclick=()=>{if(phase==='retain')recovery()};$('stop').onclick=()=>{clear();phase='idle';cycle=0;$('status').textContent='Sessão interrompida';$('circle').textContent='50';$('circle').style.transform='scale(1)';$('start').disabled=false;$('next').disabled=true;$('settings').hidden=false;$('cycle').textContent='Ciclo 0 de 3';$('timer').textContent='00:00';if(wake)wake.release().catch(()=>{})};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
